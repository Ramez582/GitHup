<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout & Diet Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box; /* تضمن أن البادينج لا يخرب العرض */
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      border: none;
      background: black;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Workout & Diet Planner</h1>

    <div class="grid">
      <div class="card">
        <h2>Workout Plan</h2>
        <textarea id="workoutInput" placeholder="Write your workout plan here..."></textarea>
      </div>

      <div class="card">
        <h2>Diet Plan</h2>
        <textarea id="dietInput" placeholder="Write your diet plan here..."></textarea>
      </div>
    </div>

    <button onclick="savePlans()">Save Plan</button>
  </div>

  <script>
    // عند فتح الصفحة: استرجع البيانات المخزنة لو كانت موجودة
    window.onload = function() {
      const savedWorkout = localStorage.getItem('workoutData');
      const savedDiet = localStorage.getItem('dietData');

      if (savedWorkout) {
        document.getElementById('workoutInput').value = savedWorkout;
      }
      if (savedDiet) {
        document.getElementById('dietInput').value = savedDiet;
      }
    };

    // وظيفة حفظ البيانات في ذاكرة المتصفح
    function savePlans() {
      const workoutValue = document.getElementById('workoutInput').value;
      const dietValue = document.getElementById('dietInput').value;

      localStorage.setItem('workoutData', workoutValue);
      localStorage.setItem('dietData', dietValue);

      alert('تم حفظ الخطط في متصفحك بنجاح! 💪');
    }
  </script>
</body>
</html>
